    <circle cx="742" cy="183" r="4" fill="#a78bfa"/>
    <circle cx="910" cy="90" r="4" fill="#a78bfa"/>
    <circle cx="1050" cy="190" r="4" fill="#38bdf8"/>
  </g>
  <g filter="url(#glow)">
    <text x="68" y="118" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="700">Kennedy Mosoti</text>
    <text x="72" y="165" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">automation // observability // infrastructure // agentic systems</text>
  </g>
  <rect x="72" y="205" width="640" height="74" rx="14" fill="#020617" opacity="0.72" stroke="#334155"/>
