<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g opacity="0.18">
    <path d="M80 285 C210 120, 335 320, 470 165 S760 80, 900 210 S1085 285, 1140 120" stroke="#38bdf8" stroke-width="2"/>
    <path d="M60 95 C210 220, 330 50, 500 120 S740 280, 910 90 S1080 160, 1160 260" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="155" cy="188" r="4" fill="#38bdf8"/>
