  <text x="98" y="264" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">then automate the boring parts.</text>
  <g transform="translate(875 85)">
    <rect width="220" height="170" rx="18" fill="#020617" opacity="0.78" stroke="#334155"/>
    <text x="24" y="44" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">signals</text>
    <text x="24" y="78" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">logs → context</text>
    <text x="24" y="108" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">state → action</text>
    <text x="24" y="138" fill="#f472b6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">chaos → tools</text>
