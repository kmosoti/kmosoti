name: profile-readme

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Check generated output and contracts
        run: |
          python3 tools/render_profile.py --check
          python3 -m unittest discover -s tests -v

      - name: Check prose
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3
        with:
          files: '["README.md", "PROFILE_README_SPEC.md", "DEPLOY.md"]'
          filter_mode: nofilter
          fail_level: any
          min_alert_level: suggestion
          reporter: github-pr-annotations
